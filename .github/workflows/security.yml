name: SafeDrop security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm ci --cache .npm-cache
      - name: Locate OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $opensslPath = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
          if (-not (Test-Path -LiteralPath $opensslPath)) { throw 'Git OpenSSL executable missing' }
          "OPENSSL_PATH=$opensslPath" >> $env:GITHUB_ENV
      - run: npm run build
      - run: npm test
      - name: TLS/WSS security scenarios
        if: runner.os == 'Linux'
        run: npm run security:report
      - name: Check report credentials before upload
        id: artifacts
        if: always() && runner.os == 'Linux'
        run: npm run ci:artifacts
      - name: Publish security scenario results
        if: always() && runner.os == 'Linux' && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenarios-${{ github.sha }}
          path: |
            reports/latest.json
            reports/latest.html
          if-no-files-found: warn
          retention-days: 14

  source-security:
    name: Workflow, dependency and credential checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --cache .npm-cache
      - run: npm run ci:workflow
      - if: always()
        run: npm run ci:audit
      - if: always()
        run: npm run ci:secrets
      - if: always()
        run: npm run ci:scanner-test
      - name: Check report credentials before upload
        id: artifacts
        if: always()
        run: npm run ci:artifacts
      - name: Publish sanitized source checks
        if: always() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-security-${{ github.sha }}
          path: reports/ci/*.json
          if-no-files-found: warn
          retention-days: 14

  image-security:
    name: Built application, gateway and scanner images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm ci --cache .npm-cache
      - name: Verify the isolated runtime containers
        id: runtime
        shell: pwsh
        run: ./scripts/verify-container.ps1
      - name: Record sanitized runtime results
        if: always() && steps.runtime.outcome == 'success'
        run: npm run ci:runtime-report
      - name: Verify old CA compatibility with the actual gateway binaries
        if: always() && steps.runtime.outcome == 'success'
        shell: bash
        run: |
          mkdir -p tmp
          baseline=$(docker create caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0)
          trap 'docker rm -v "$baseline" >/dev/null' EXIT
          docker cp "$baseline:/usr/bin/caddy" tmp/gateway-baseline
          docker compose -p safedrop-check -f compose.yaml -f deploy/compose.verify.yaml cp gateway:/usr/bin/caddy tmp/gateway-candidate
          chmod +x tmp/gateway-baseline tmp/gateway-candidate
          GATEWAY_BASELINE_BINARY="$PWD/tmp/gateway-baseline" GATEWAY_BINARY="$PWD/tmp/gateway-candidate" node --test tests/gateway-smoke.test.mjs
      - name: Scan the actual built application image
        if: always() && steps.runtime.outcome == 'success'
        run: npm run ci:image -- safedrop:verify
      - name: Scan the gateway image
        if: always() && steps.runtime.outcome == 'success'
        run: npm run ci:image -- safedrop-gateway:verify
      - name: Scan the actual patched scanner image
        if: always() && steps.runtime.outcome == 'success'
        run: npm run ci:image -- safedrop-scanner:verify
      - name: Check report credentials before upload
        id: artifacts
        if: always()
        run: npm run ci:artifacts
      - name: Publish image results
        if: always() && steps.artifacts.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security-${{ github.sha }}
          path: reports/ci/*.json
          if-no-files-found: warn
          retention-days: 14
