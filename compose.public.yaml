name: safedrop-public
services:
  app:
    extends: {file: compose.yaml, service: app}
    environment:
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN to a controlled public domain}
  gateway:
    image: caddy:2.11.9-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - ./deploy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend, edge]
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
networks:
  backend: {internal: true}
  edge:
volumes:
  app_data:
  caddy_data:
  caddy_config:
